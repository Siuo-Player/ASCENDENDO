name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release (Windows x64)
    runs-on: windows-2025-vs2026
    timeout-minutes: 25

    env:
      VULKAN_SDK_VERSION: 1.4.309.0
      GLFW_COMMIT: 7b6aead9fb88b3623e3b3725ebb42670cbe4c579
      LLVM_VERSION: 20.1.8

    steps:
      - name: Checkout ASCENDENDO
        uses: actions/checkout@v6

      - name: Install GNU Make
        shell: pwsh
        run: choco install make --yes --no-progress

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}
          arch: x64

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true
          install_lavapipe: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure native Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch and Build GLFW Release
        shell: pwsh
        run: |
          $glfwSrc = Join-Path $env:RUNNER_TEMP 'glfw-src'
          git clone --no-checkout https://github.com/glfw/glfw.git $glfwSrc
          git -C $glfwSrc checkout $env:GLFW_COMMIT
          $glfwBuild = Join-Path $env:RUNNER_TEMP 'glfw-build'
          cmake -S $glfwSrc -B $glfwBuild -G 'Visual Studio 18 2026' -A x64 -DGLFW_BUILD_DOCS=OFF -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_EXAMPLES=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL
          cmake --build $glfwBuild --config Release --target glfw
          New-Item -ItemType Directory -Force -Path 'external\glfw\lib-vc2022' | Out-Null
          Copy-Item (Join-Path $glfwBuild 'src\Release\glfw3.lib') 'external\glfw\lib-vc2022\glfw3.lib' -Force

      - name: Build Game Binary
        shell: pwsh
        run: |
          make clean
          make game -j4

      - name: Package Release Archive
        shell: pwsh
        run: |
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '${{ inputs.version }}' }
          python Development/Tools/package_release.py --version $tag

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: ASCENDENDO v${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/ascendendo-windows-x64.zip
            dist/ascendendo-windows-x64.zip.sha256
            dist/ascendendo-v*.zip
            dist/ascendendo-v*.zip.sha256
