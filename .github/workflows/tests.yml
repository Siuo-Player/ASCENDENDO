name: Tests

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Linux / Clang / C++20 / Headless Vulkan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install toolchain and headless graphics dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang make pkg-config libvulkan-dev libglfw3-dev glslc xvfb mesa-vulkan-drivers vulkan-tools

      - name: Test source-size policy
        run: python3 Tests/Tooling/test_check_source_sizes.py

      - name: Check source-file size policy
        run: python3 Development/Tools/check_source_sizes.py

      - name: Select deterministic Vulkan software driver
        shell: bash
        run: |
          set -euo pipefail
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          echo "Using Vulkan ICD: $ICD"
          vulkaninfo --summary > vulkaninfo-summary.txt 2>&1
          grep -E 'Vulkan Instance Version:|deviceName|driverName|driverInfo' vulkaninfo-summary.txt

      - name: Build and run tests in virtual X display
        shell: bash
        run: |
          set -euo pipefail

          run_quiet() {
            local label="$1"
            shift
            local log="build-${label}.log"

            echo "[CI] ${label}..."
            if ! "$@" >"$log" 2>&1; then
              echo "[CI] ${label}: FAILED — diagnostic tail"
              tail -n 200 "$log"
              return 1
            fi
            echo "[CI] ${label}: OK"
          }

          run_quiet clean xvfb-run -a -s '-screen 0 1280x720x24' make clean
          run_quiet game-build xvfb-run -a -s '-screen 0 1280x720x24' make game -j2
          run_quiet tests xvfb-run -a -s '-screen 0 1280x720x24' make tests -j2

          echo "[CI] Test summary:"
          grep -E '\[doctest\] (test cases|assertions|Status:)' build-tests.log

      - name: Upload Linux CI diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-ci-diagnostics
          path: |
            build-clean.log
            build-game-build.log
            build-tests.log
            build\test_results.txt
            vulkaninfo-summary.txt
          if-no-files-found: warn

      - name: Validate active campaign levels
        run: python3 Development/AI_Validation/ai_validator.py --campaign
