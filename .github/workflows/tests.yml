name: Tests

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Linux / Clang / C++20 / Headless Vulkan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and headless graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make pkg-config libvulkan-dev libglfw3-dev glslc xvfb mesa-vulkan-drivers vulkan-tools

      - name: Check source-file size and line policy
        run: python3 Development/Tools/check_source_sizes.py

      - name: Select deterministic Vulkan software driver
        shell: bash
        run: |
          set -euo pipefail
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          echo "Using Vulkan ICD: $ICD"
          vulkaninfo --summary

      - name: Clean build outputs
        shell: bash
        run: make clean

      - name: Build game
        shell: bash
        run: make game -j2

      - name: Build test binary
        shell: bash
        run: make tests-verbose -j2

      - name: Run integration and unit tests
        shell: bash
        run: xvfb-run -a -s '-screen 0 1280x720x24' make tests-verbose
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: "llvmpipe"
          VK_LOADER_DEBUG: "error"

      - name: Validate active campaign levels
        shell: bash
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 Development/AI_Validation/ai_validator.py --campaign
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: "llvmpipe"
          VK_LOADER_DEBUG: "error"
