name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Linux / Clang / C++20 / Headless Vulkan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and headless graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make pkg-config libvulkan-dev libglfw3-dev glslc xvfb mesa-vulkan-drivers

      - name: Build and run tests in virtual X display
        run: xvfb-run -a make clean && xvfb-run -a make tests-verbose -j2
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: "llvmpipe"

      - name: Validate active campaign levels
        run: python3 Development/AI_Validation/ai_validator.py --campaign
