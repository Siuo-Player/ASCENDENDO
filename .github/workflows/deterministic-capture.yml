name: Deterministic Capture Evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Linux / deterministic PPM capture (${{ matrix.aspect }}, level ${{ matrix.level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { level: 0, aspect: "16-9", width: 1152, height: 648, screen: "1280x720" }
          - { level: 1, aspect: "16-9", width: 1152, height: 648, screen: "1280x720" }
          - { level: 2, aspect: "16-9", width: 1152, height: 648, screen: "1280x720" }
          - { level: 0, aspect: "4-3",  width: 800,  height: 600, screen: "1280x960" }
          - { level: 1, aspect: "4-3",  width: 800,  height: 600, screen: "1280x960" }
          - { level: 2, aspect: "4-3",  width: 800,  height: 600, screen: "1280x960" }
          - { level: 0, aspect: "21-9", width: 1680, height: 720, screen: "1920x1080" }
          - { level: 1, aspect: "21-9", width: 1680, height: 720, screen: "1920x1080" }
          - { level: 2, aspect: "21-9", width: 1680, height: 720, screen: "1920x1080" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and headless graphics dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang make pkg-config libvulkan-dev libglfw3-dev glslc xvfb mesa-vulkan-drivers vulkan-tools

      - name: Select deterministic Vulkan software driver
        shell: bash
        run: |
          set -euo pipefail
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          echo "Using Vulkan ICD: $ICD"

      - name: Build release game
        run: xvfb-run -a -s '-screen 0 ${{ matrix.screen }}x24' make game -j2
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: "llvmpipe"
          VK_LOADER_DEBUG: "error"

      - name: Stage runtime assets beside executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/game/Game
          cp -a Game/Assets build/game/Game/
          test -f build/game/Game/Assets/Levels/campaign.txt
          test -f build/game/Game/Assets/Sprites/personagem.png

      - name: Capture level
        run: |
          mkdir -p artifacts
          xvfb-run -a -s '-screen 0 ${{ matrix.screen }}x24' \
            python3 Development/AI_Validation/validate_deterministic_capture.py \
              --binary build/game/game \
              --level ${{ matrix.level }} \
              --output artifacts/level-${{ matrix.level }}-${{ matrix.aspect }}.ppm \
              --width ${{ matrix.width }} \
              --height ${{ matrix.height }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: "llvmpipe"
          VK_LOADER_DEBUG: "error"

      - name: Upload PPM evidence
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-capture-level-${{ matrix.level }}-${{ matrix.aspect }}
          path: artifacts/level-${{ matrix.level }}-${{ matrix.aspect }}.ppm
          if-no-files-found: error
