name: Sanitizers

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asan-ubsan:
    name: Linux / Clang / ASan + UBSan / Headless Vulkan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install toolchain and headless graphics dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang make pkg-config libvulkan-dev libglfw3-dev glslc xvfb mesa-vulkan-drivers vulkan-tools

      - name: Test source-size policy
        run: python3 Tests/Tooling/test_check_source_sizes.py

      - name: Check source-file size policy
        run: python3 Development/Tools/check_source_sizes.py

      - name: Select deterministic Vulkan software driver
        shell: bash
        run: |
          set -euo pipefail
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          echo "Using Vulkan ICD: $ICD"
          vulkaninfo --summary > vulkaninfo-summary.txt 2>&1
          grep -E 'Vulkan Instance Version:|deviceName|driverName|driverInfo' vulkaninfo-summary.txt

      - name: Build and run fully instrumented tests
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          SAN_FLAGS='-g -O0 -DDEBUG -fsanitize=address,undefined -fno-omit-frame-pointer'

          xvfb-run -a -s '-screen 0 1280x720x24' make clean
          xvfb-run -a -s '-screen 0 1280x720x24' \
            make tests -j2 \
            CXXFLAGS_REL="$SAN_FLAGS"

      - name: Upload sanitizer diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sanitizer-ci-diagnostics
          path: |
            build/test_results.txt
            vulkaninfo-summary.txt
          if-no-files-found: warn

      - name: Validate active campaign levels
        run: python3 Development/AI_Validation/ai_validator.py --campaign
